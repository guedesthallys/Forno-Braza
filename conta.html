<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Minha Conta — Forno & Braza</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Minha Conta</h1>
            <div class="divisor-espeto"></div>
        </header>
        <nav class="menu-site">
            <a href="index.html">Início</a>
            <a href="cardapio.html">Fazer Pedido</a>
            <a href="meus-pedidos.html">Meus Pedidos</a>
            <a href="login.html">Entrar / Minha Conta</a>
            <a href="admin.html" id="linkAdmin" hidden>Painel Admin</a>
        </nav>
        <main>
            <section>
                <h2>Seus dados</h2>
                <form id="formConta">
                    <div class="campo">
                        <label>Nome</label>
                        <input id="contaNome" required>
                    </div>
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" id="contaEmail" required>
                    </div>
                    <div class="campo">
                        <label>Endereço</label>
                        <input id="contaEndereco" required>
                    </div>
                    <button>Salvar alterações</button>
                </form>
                <p id="contaMsg" class="mensagem"></p>
                <button id="excluirConta" class="botao-perigo">Excluir minha conta</button>
                <button id="sairConta">Sair da conta</button>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
