<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel Admin — Forno & Braza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Painel Administrativo</h1>
        <p>Gerencie pedidos e cardápio</p>
        <div class="divisor-espeto"></div>
</header>
<nav class="menu-site">
    <a href="index.html">Início</a>
    <a href="cardapio.html">Fazer Pedido</a>
    <a href="meus-pedidos.html">Meus Pedidos</a>
    <a href="login.html">Entrar / Minha Conta</a>
    <a href="admin.html" id="linkAdmin">Painel Admin</a>
</nav>

<main>
    <section>
        <h2>Pedidos dos clientes</h2>
        <div id="listaTodosPedidos">
        </div>
    </section>
    
    <section>
        <h2>Adicionar ou editar produto</h2>
        <form id="formProduto">
            <input type="hidden" id="produtoId">
            <div class="campo"><label>Nome</label>
                <input id="produtoNome" required>
            </div><div class="campo">
                <label>Descrição</label>
                <textarea id="produtoDescricao">

                </textarea>
            </div>
            <div class="linha-campos">
                <div class="campo">
                    <label>Categoria</label>
                    <select id="produtoCategoria">
                        <option>Pizza</option>
                        <option>Bebida</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Preço (R$)</label>
                    <input type="number" id="produtoPreco" min="0.01" step="0.01" required>
                </div>
            </div>
            <button>Salvar produto</button>
            <button type="button" id="limparProduto">Limpar</button>
            <p id="produtoMsg" class="mensagem"></p>
        </form>
        <div id="listaProdutosAdmin">

        </div>
    </section>
    <section>
        <h2>Taxa de entrega</h2>
        <form id="formTaxa">
            <div class="campo">
                <label>Valor em reais</label>
                <input type="number" id="taxaEntrega" min="0" step="0.01" value="7">
            </div><button>Salvar taxa</button>
        </form>
        <p id="taxaMsg" class="mensagem"></p>
        </section>
        <section>
            <h2>Cadastrar outro administrador</h2>
            <form id="formAdmin"><div class="campo">
                <label>Nome</label><input id="adminNome" required>
            </div>
            <div class="campo">
                <label>E-mail</label>
                <input type="email" id="adminEmail" required>
            </div>
            <div class="campo">
                <label>Senha</label>
                <input type="password" id="adminSenha" minlength="4" required>
            </div>
            <button>Cadastrar administrador</button>
        </form>
        <p id="adminMsg" class="mensagem"></p>
    </section>
</main>
<script src="script.js"></script>
</body>
</html>
