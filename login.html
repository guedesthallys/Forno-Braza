<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Entrar — Forno & Braza</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Forno & Braza</h1>
            <p>Entre ou crie sua conta</p>
            <div class="divisor-espeto"></div>
        </header>
        <nav class="menu-site">
            <a href="index.html">Início</a>
            <a href="cardapio.html">Fazer Pedido</a>
            <a href="meus-pedidos.html">Meus Pedidos</a>
            <a href="login.html">Entrar / Minha Conta</a>
            <a href="admin.html" id="linkAdmin" hidden>Painel Admin</a>
        </nav>
        <main>
            <section>
                <h2>Entrar na conta</h2>
                <form id="formLogin">
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" id="loginEmail" required></div>
                        <div class="campo">
                            <label>Senha</label>
                            <input type="password" id="loginSenha" required></div>
                            <button type="submit">Entrar</button>
                            <p id="loginMsg" class="mensagem"></p>
                        </form>
                    </section>
                    <section>
                        <h2>Cadastro rápido</h2>
                        <form id="formCadastro">
                            <div class="campo">
                                <label>Nome</label>
                                <input id="cadNome" required minlength="3"></div>
                                <div class="campo"><label>E-mail</label>
                                    <input type="email" id="cadEmail" required></div>
                                    <div class="campo"><label>Senha</label>
                                        <input type="password" id="cadSenha" required minlength="4"></div>
                                        <div class="campo"><label>Endereço</label>
                                            <input id="cadEndereco" required></div>
                                            <button type="submit">Criar conta</button>
                                            <p id="cadMsg" class="mensagem"></p>
                                        </form>
                                    </section>
                                </main>
                                <script src="script.js"></script>
                                </body>
                                </html>
